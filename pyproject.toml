[project]
name = "exgen"
version = "0.1.0"
description = "Example generation experiments for low-resource languages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets==4.6.1",
    "google-genai",
    "matplotlib",
    "mistral-common==1.9.1",
    "pandas",
    "python-dotenv",
    "pydantic",
    "pyyaml",
    "requests==2.32.5",
    "transformers==5.2.0",
    "ipykernel>=7.2.0",
    "peft>=0.18.1",
    "bitsandbytes>=0.49.2",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes==0.49.2; sys_platform != 'darwin'",
    "peft==0.18.1; sys_platform != 'darwin'",
    "torch==2.10.0; sys_platform != 'darwin'",
    "trl==0.29.0; sys_platform != 'darwin'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
