[project]
name = "exgen"
version = "0.1.0"
description = "Example generation experiments for low-resource languages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets==4.6.1",
    "google-genai",
    "matplotlib",
    "mistral-common==1.9.1",
    "openai>=2.0.0",
    "pandas",
    "pyarrow>=20.0.0",
    "python-dotenv",
    "pydantic",
    "pyyaml",
    "requests==2.32.5",
    "transformers==5.2.0",
    "ipykernel>=7.2.0",
    "torch==2.10.0",
    "peft>=0.18.1",
    "trl>=0.29.0",
    "huggingface-hub>=1.7.1",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes==0.49.2; sys_platform != 'darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
